<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 12px;
            background: #323232;
            color: #e0e0e0;
            font-family: "Adobe Clean", sans-serif;
            font-size: 12px;
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 14px;
            border-bottom: 1px solid #4a4a4a;
            padding-bottom: 8px;
        }
        .section {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: #b0b0b0;
            font-size: 11px;
        }
        select, input[type="range"] {
            width: 100%;
            box-sizing: border-box;
        }
        select {
            padding: 6px;
            background: #1e1e1e;
            border: 1px solid #4a4a4a;
            color: #e0e0e0;
            border-radius: 4px;
        }
        input[type="range"] {
            height: 4px;
            -webkit-appearance: none;
            background: #4a4a4a;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #0d99ff;
            border-radius: 50%;
            cursor: pointer;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-primary {
            background: #0d99ff;
            color: white;
        }
        .btn-primary:hover {
            background: #2ba6ff;
        }
        .btn-secondary {
            background: #4a4a4a;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background: #5a5a5a;
        }
        #status {
            padding: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
            color: #8a8a8a;
        }
        #status.success { color: #4caf50; background: #1e3a1e; }
        #status.error { color: #f44336; background: #3a1e1e; }
        #status.processing { color: #2196f3; background: #1e2a3a; }
        .hint { font-size: 10px; color: #888; }
        .color-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .palette-color {
            width: 28px;
            height: 28px;
            border: 2px solid #4a4a4a;
            border-radius: 4px;
            padding: 0;
            cursor: pointer;
        }
        #customPaletteSection, #halftoneOptions, #tileGlitchOptions {
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #4a4a4a;
            padding-bottom: 8px;
        }
        .header h2 {
            margin: 0;
            border: none;
            padding: 0;
        }
        .settings-btn {
            width: auto;
            padding: 4px 8px;
            margin: 0;
            background: transparent;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .settings-btn:hover {
            background: #4a4a4a;
        }
        .settings-pane {
            background: #2a2a2a;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .settings-pane.hidden {
            display: none;
        }
        .settings-pane h3 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #b0b0b0;
        }
        .settings-pane hr {
            border: none;
            border-top: 1px solid #4a4a4a;
            margin: 12px 0 0 0;
        }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-row label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            cursor: pointer;
        }
        .setting-row input[type="checkbox"] {
            width: auto;
        }
        .tooltip-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background: #4a4a4a;
            border-radius: 50%;
            font-size: 10px;
            cursor: help;
            position: relative;
            z-index: 10;
        }
        .tooltip-text {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #1e1e1e;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 8px;
            width: 200px;
            font-size: 10px;
            color: #b0b0b0;
            z-index: 9999;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .tooltip-trigger:hover .tooltip-text {
            display: block;
        }
        .select-with-tooltip {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .select-with-tooltip select {
            flex: 1;
        }
        .select-with-tooltip .tooltip-trigger {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Dither Effect Pro</h2>
        <button id="settingsToggle" class="settings-btn" title="Settings">⚙️</button>
    </div>

    <div id="settingsPane" class="settings-pane hidden">
        <h3>Settings</h3>
        <div class="setting-row">
            <label>
                <input type="checkbox" id="limitImageSize" checked>
                Limit image size to 50 MP
                <span class="tooltip-trigger">?
                    <span class="tooltip-text">Helps prevent memory exhaustion and crashes when processing very large images. Disable at your own risk.</span>
                </span>
            </label>
        </div>
        <hr>
    </div>

    <div class="section">
        <label>Algorithm</label>
        <div class="select-with-tooltip">
            <select id="algorithm">
                <option value="floyd-steinberg" selected>Floyd-Steinberg</option>
                <option value="atkinson">Atkinson</option>
                <option value="ordered-bayer">Ordered (Bayer 4x4)</option>
                <option value="ordered-bayer8">Ordered (Bayer 8x8)</option>
                <option value="random">Random Noise</option>
                <option value="halftone">Halftone</option>
                <option value="sierra">Sierra Lite</option>
                <option value="stucki">Stucki</option>
                <option value="tile-glitch">Tile Glitch</option>
            </select>
            <span class="tooltip-trigger" id="algorithmHelp">?
                <span class="tooltip-text" id="algorithmTooltip">Classic error diffusion. Best for general purpose, smooth gradients.</span>
            </span>
        </div>
    </div>

    <div class="section">
        <label>Color Mode</label>
        <select id="colorMode">
            <option value="bw" selected>Black & White</option>
            <option value="grayscale">Grayscale (4 levels)</option>
            <option value="grayscale8">Grayscale (8 levels)</option>
            <option value="rgb">RGB (Web Safe)</option>
            <option value="custom">Custom Palette</option>
        </select>
    </div>

    <div class="section" id="customPaletteSection">
        <label>Custom Palette</label>
        <div class="color-swatches">
            <input type="color" class="palette-color" value="#000000">
            <input type="color" class="palette-color" value="#FFFFFF">
            <input type="color" class="palette-color" value="#FF0000">
            <input type="color" class="palette-color" value="#00FF00">
            <input type="color" class="palette-color" value="#0000FF">
            <input type="color" class="palette-color" value="#FFFF00">
        </div>
    </div>

    <div class="section">
        <label>Strength: <span id="strengthValue">100</span>%</label>
        <input type="range" id="strength" min="0" max="100" value="100">
    </div>

    <div class="section">
        <label>Scale: <span id="scaleValue">1</span>x <span class="hint">(higher = chunkier pixels)</span></label>
        <input type="range" id="scale" min="1" max="16" value="1">
    </div>

    <div class="section" id="halftoneOptions">
        <label>Dot Size: <span id="dotSizeValue">4</span>px</label>
        <input type="range" id="dotSize" min="2" max="16" value="4">
        <label>Angle: <span id="angleValue">45</span>°</label>
        <input type="range" id="angle" min="0" max="90" value="45">
    </div>

    <div class="section" id="tileGlitchOptions">
        <label>Tile Size: <span id="tileSizeValue">8</span>px</label>
        <input type="range" id="tileSize" min="4" max="64" value="8">
        <label>Severity: <span id="severityValue">50</span>% <span class="hint">(tile rearrangement)</span></label>
        <input type="range" id="severity" min="0" max="100" value="50">
        <label>Mangle: <span id="mangleValue">0</span>% <span class="hint">(tile distortion)</span></label>
        <input type="range" id="mangle" min="0" max="100" value="0">
    </div>

    <div class="checkbox-row">
        <input type="checkbox" id="preserveTransparency">
        <label for="preserveTransparency" style="margin:0">Preserve Transparency</label>
    </div>

    <button id="applyBtn" class="btn-primary">Apply Dither</button>
    <button id="undoBtn" class="btn-secondary">Undo</button>
    
    <div id="status">Ready. Select a layer and click Apply.</div>
    
    <script src="index.js"></script>
</body>
</html>
